  - name: notifyTerminatedNoAction
    action: aws:executeScript
    description: >-
      Instance is terminated / not-found — alert only, NO DRS teardown.
      Termination strips the DR tag and fires the offboarding rule, but a
      terminated instance is indistinguishable from a disaster, so the source
      server is left intact (it may be the recovery point). SOP: set DR=no to
      offboard cleanly BEFORE terminating.
    onFailure: Continue
    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        Account: '{{ global:ACCOUNT_ID }}'
        InstanceId: '{{ normalizeInstanceId.InstanceId }}'
        Event: 'OFFBOARD'
        Status: 'SKIPPED_TERMINATED'
        Detail: 'Instance terminated/not-found. Teardown intentionally skipped (termination is indistinguishable from a disaster; source server may be the recovery point). Review and remove the orphaned source server manually if the termination was intentional.'
        SnsTopicArn: '{{ SnsTopicArn }}'
        Subject: '[DRS Offboarding SKIPPED - instance terminated] {{ normalizeInstanceId.InstanceId }}'
        Message: 'Offboarding was triggered for {{ normalizeInstanceId.InstanceId }} but the instance is terminated/not-found (state={{ assessInstance.InstanceState }}, DR={{ assessInstance.DrValue }}). NO teardown was performed - termination is indistinguishable from a disaster and the DRS source server may be needed for recovery. If this termination was intentional, remove the orphaned source server manually. SOP: set DR=no to offboard cleanly BEFORE terminating.'
        Bucket: '{{ AuditBucket }}'
        Namespace: '{{ CloudWatchNamespace }}'
      Script: |
        import boto3, json
        from datetime import datetime
        def handler(e, c):
            status=e.get('Status',''); event=e.get('Event',''); iid=e.get('InstanceId','')
            ts=datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
            rec={'instanceId':iid,'event':event,'overallStatus':status,'sourceServerID':e.get('SourceServerID',''),'detail':e.get('Detail',''),'timestamp':ts}
            out={}
            topic=e.get('SnsTopicArn') or ''
            if topic:
                try:
                    boto3.client('sns').publish(TopicArn=topic, Subject=(e.get('Subject') or 'DRS')[:100], Message=(e.get('Message') or json.dumps(rec)))
                    out['sns']='sent'
                except Exception as ex: out['snsError']=str(ex)
            good={'SUCCESS','HEALED','HEALED_RESTART','HEALED_REINSTALL','SKIPPED_HEALTHY','HEALTHY','IN_PROGRESS','AUDIT_NOACTION','PENDING_REGISTRATION','COMPLETED','NO_SERVER','SKIPPED_TERMINATED','SKIPPED_DR_EVENT'}
            try:
                boto3.client('cloudwatch').put_metric_data(Namespace=e.get('Namespace','DRSAutomation'),
                  MetricData=[{'MetricName':'Outcome','Value':1 if status in good else 0,'Unit':'Count','Dimensions':[{'Name':'Event','Value':event}]}])
                out['metric']='ok'
            except Exception as ex: out['metricError']=str(ex)
            bucket=e.get('Bucket') or ''
            if bucket:
                try:
                    key='drs/%s/%s/%s-%s.json'%(e.get('Account','acct'), iid or 'unknown', event or 'event', ts.replace(':','-'))
                    boto3.client('s3').put_object(Bucket=bucket, Key=key, Body=json.dumps(rec).encode(), ContentType='application/json')
                    out['s3']='s3://%s/%s'%(bucket,key)
                except Exception as ex: out['s3Error']=str(ex)
            return out
