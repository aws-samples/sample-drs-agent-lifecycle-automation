            good={'SUCCESS','HEALED','HEALED_RESTART','HEALED_REINSTALL','SKIPPED_HEALTHY','HEALTHY','IN_PROGRESS','AUDIT_NOACTION','PENDING_REGISTRATION','COMPLETED','SKIPPED_STOPPED'}
            try:
                boto3.client('cloudwatch').put_metric_data(Namespace=e.get('Namespace','DRSAutomation'),
                  MetricData=[{'MetricName':'Outcome','Value':1 if status in good else 0,'Unit':'Count','Dimensions':[{'Name':'Event','Value':event}]}])
                out['metric']='ok'
            except Exception as ex: out['metricError']=str(ex)
            bucket=e.get('Bucket') or ''
            if bucket:
                try:
                    key='drs/%s/%s/%s-%s.json'%(e.get('Account','acct'), iid or 'unknown', event or 'event', ts.replace(':','-'))
                    boto3.client('s3').put_object(Bucket=bucket, Key=key, Body=json.dumps(rec).encode(), ContentType='application/json')
                    out['s3']='s3://%s/%s'%(bucket,key)
                except Exception as ex: out['s3Error']=str(ex)
            return out
    isEnd: true

  - name: notifyPendingEscalation
    action: aws:executeScript
    description: Notify (SNS) + S3 audit + metric — instance has been PENDING_REGISTRATION for >= threshold consecutive runs (agent up but not registered, or persistently unable to register).
    onFailure: Continue
    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        Account: '{{ global:ACCOUNT_ID }}'
        InstanceId: '{{ InstanceId }}'
        Event: 'ONBOARD'
        Status: 'PENDING_ESCALATED'
        SourceServerID: ''
        Detail: 'PENDING_REGISTRATION for {{ trackPending.PendingCount }} consecutive runs (threshold {{ PendingEscalationThreshold }}).'
        SnsTopicArn: '{{ SnsTopicArn }}'
        Subject: '[DRS Onboarding - not registering] {{ InstanceId }}'
        Message: 'Instance {{ InstanceId }} (DR=yes) has been PENDING_REGISTRATION for {{ trackPending.PendingCount }} consecutive runs (threshold {{ PendingEscalationThreshold }}). The agent may be installed but is not registered/replicating in {{ TargetRegion }} - likely causes: DRS not initialized in the DR region, control-plane (443) connectivity blocked, or registration failing. The instance is tagged for protection but is currently UNPROTECTED - investigate.'
        Bucket: '{{ AuditBucket }}'
        Namespace: '{{ CloudWatchNamespace }}'
      Script: |
        import boto3, json
        from datetime import datetime
        def handler(e, c):
            status=e.get('Status',''); event=e.get('Event',''); iid=e.get('InstanceId','')
            ts=datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
            rec={'instanceId':iid,'event':event,'overallStatus':status,'sourceServerID':e.get('SourceServerID',''),'detail':e.get('Detail',''),'timestamp':ts}
            out={}
            topic=e.get('SnsTopicArn') or ''
            if topic:
                try:
                    boto3.client('sns').publish(TopicArn=topic, Subject=(e.get('Subject') or 'DRS')[:100], Message=(e.get('Message') or json.dumps(rec)))
                    out['sns']='sent'
                except Exception as ex: out['snsError']=str(ex)
            good={'SUCCESS','HEALED','HEALED_RESTART','HEALED_REINSTALL','SKIPPED_HEALTHY','HEALTHY','IN_PROGRESS','AUDIT_NOACTION','PENDING_REGISTRATION','COMPLETED','SKIPPED_STOPPED'}
            try:
                boto3.client('cloudwatch').put_metric_data(Namespace=e.get('Namespace','DRSAutomation'),
                  MetricData=[{'MetricName':'Outcome','Value':1 if status in good else 0,'Unit':'Count','Dimensions':[{'Name':'Event','Value':event}]}])
                out['metric']='ok'
            except Exception as ex: out['metricError']=str(ex)
            bucket=e.get('Bucket') or ''
            if bucket:
                try:
                    key='drs/%s/%s/%s-%s.json'%(e.get('Account','acct'), iid or 'unknown', event or 'event', ts.replace(':','-'))
                    boto3.client('s3').put_object(Bucket=bucket, Key=key, Body=json.dumps(rec).encode(), ContentType='application/json')
                    out['s3']='s3://%s/%s'%(bucket,key)
                except Exception as ex: out['s3Error']=str(ex)
            return out
    isEnd: true

