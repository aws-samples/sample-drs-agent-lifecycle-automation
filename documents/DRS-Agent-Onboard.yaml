    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        Account: '{{ global:ACCOUNT_ID }}'
        InstanceId: '{{ InstanceId }}'
        Event: 'ONBOARD'
        Status: 'UNHEALTHY'
        SourceServerID: '{{ assessRegistration.SourceServerID }}'
        Detail: '{{ assessRegistration.ReplicationState }}'
        SnsTopicArn: '{{ SnsTopicArn }}'
        Subject: '[DRS Onboarding - replication unhealthy] {{ InstanceId }}'
        Message: 'Instance {{ InstanceId }} source server {{ assessRegistration.SourceServerID }} is registered in {{ TargetRegion }} but replication state is {{ assessRegistration.ReplicationState }}. Investigate connectivity / agent health.'
        Bucket: '{{ AuditBucket }}'
        Namespace: '{{ CloudWatchNamespace }}'
      Script: |
