            good={'SUCCESS','HEALED','HEALED_RESTART','HEALED_REINSTALL','SKIPPED_HEALTHY','HEALTHY','IN_PROGRESS','AUDIT_NOACTION','PENDING_REGISTRATION','COMPLETED','SKIPPED_STOPPED'}
            try:
                boto3.client('cloudwatch').put_metric_data(Namespace=e.get('Namespace','DRSAutomation'),
                  MetricData=[{'MetricName':'Outcome','Value':1 if status in good else 0,'Unit':'Count','Dimensions':[{'Name':'Event','Value':event}]}])
                out['metric']='ok'
            except Exception as ex: out['metricError']=str(ex)
            bucket=e.get('Bucket') or ''
            if bucket:
                try:
                    key='drs/%s/%s/%s-%s.json'%(e.get('Account','acct'), iid or 'unknown', event or 'event', ts.replace(':','-'))
                    boto3.client('s3').put_object(Bucket=bucket, Key=key, Body=json.dumps(rec).encode(), ContentType='application/json')
                    out['s3']='s3://%s/%s'%(bucket,key)
                except Exception as ex: out['s3Error']=str(ex)
            return out
    isEnd: true

  - name: notifyReverseDirection
