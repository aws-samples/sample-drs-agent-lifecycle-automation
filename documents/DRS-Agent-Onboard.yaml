  - name: branchTagWindows
    action: aws:branch
    description: Attach the failback tag only when the DRS agent is present (installed, any status); otherwise skip tagging.
    inputs:
      Choices:
        - NextStep: tagInstance
          Variable: '{{ evalPresenceWindows.AgentPresent }}'
          StringEquals: 'true'
      Default: assessRegistration

  - name: tagInstance
    action: aws:executeAwsApi
    description: >-
      Apply the failback tag in the Automation control plane (uses the
      AutomationAssumeRole, not the instance profile). Reached only when the DRS
      agent is PRESENT on the instance (branchTag* gate). Idempotent — CreateTags
      adds the tag if missing and is a no-op if already present, so it also
      corrects drift where an agent-present instance lost its failback tag.
    inputs:
      Service: ec2
      Api: CreateTags
      Resources:
        - '{{ InstanceId }}'
      Tags:
        - Key: AWSDRS
          Value: AllowLaunchingIntoThisInstance
    nextStep: assessRegistration

  - name: assessRegistration
    action: aws:executeScript
    description: >-
      Control-plane, registration-aware health check. Confirms the instance is
      registered as a source server in TargetRegion (match on awsInstanceID),
      reports replication state, and detects reverse/failback registration via
      the source server's replicationDirection field (FAILBACK). Polls up to
      AgentRegistrationTimeout for a fresh install to register. Uses the
      AutomationAssumeRole's drs:DescribeSourceServers.
    timeoutSeconds: 1200
    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        InstanceId: '{{ InstanceId }}'
        TargetRegion: '{{ TargetRegion }}'
        TimeoutMinutes: '{{ AgentRegistrationTimeout }}'
      Script: |
        import boto3, time
        def find(region, iid):
            drs = boto3.client('drs', region_name=region)
            for page in drs.get_paginator('describe_source_servers').paginate(filters={}):
                for s in page.get('items', []):
                    hints = s.get('sourceProperties', {}).get('identificationHints', {})
                    if hints.get('awsInstanceID') == iid:
                        return s
            return None
        def handler(event, context):
            iid = event['InstanceId']
            target = event['TargetRegion']
            try:
                timeout_min = float(event.get('TimeoutMinutes', '15'))
            except Exception:
                timeout_min = 15.0
            # Bounded poll (cap at ~18 min to stay within step timeout)
            deadline = time.time() + min(timeout_min, 18) * 60
            srv = None
            while time.time() < deadline:
                srv = find(target, iid)
                if srv:
                    break
                time.sleep(30)
            if not srv:
                return {'Status': 'PENDING_REGISTRATION',
                        'SourceServerID': '',
                        'ReplicationState': 'NONE',
                        'Detail': 'No source server registered in TargetRegion yet (expected immediately after a fresh install or in audit mode).'}
            ssid = srv['sourceServerID']
            state = srv.get('dataReplicationInfo', {}).get('dataReplicationState', 'UNKNOWN')
            # Reverse/failback detection: DRS sets replicationDirection=FAILBACK when
            # replication runs from a recovery instance back to origin (post-failover
            # failback). For a forward-protection onboarding this is a mis-registration
            # / DR operation in progress — flag it and do NOT treat as a normal install.
            direction = srv.get('replicationDirection', 'FAILOVER') or 'FAILOVER'
            if direction == 'FAILBACK':
                status = 'REVERSE_REPLICATION'
            elif state in ('STALLED', 'DISCONNECTED'):
                status = 'UNHEALTHY'
            elif state in ('INITIAL_SYNC', 'RESCAN', 'CREATING_SNAPSHOT'):
                status = 'IN_PROGRESS'
            else:
                status = 'HEALTHY'
            return {'Status': status,
                    'SourceServerID': ssid,
                    'ReplicationState': state,
                    'Detail': 'Registered in %s as %s, state=%s, direction=%s' % (target, ssid, state, direction)}
    outputs:
      - Name: Status
        Selector: '$.Payload.Status'
        Type: String
      - Name: SourceServerID
        Selector: '$.Payload.SourceServerID'
        Type: String
      - Name: ReplicationState
        Selector: '$.Payload.ReplicationState'
        Type: String
    nextStep: trackPending

  - name: trackPending
    action: aws:executeScript
    description: >-
      Persist a per-instance consecutive PENDING_REGISTRATION counter in SSM
      Parameter Store (/drs/pending/<instanceId>). Clears it on any registered
      state; escalates once the count reaches PendingEscalationThreshold. This
      catches a box whose agent is "running locally but never registered"
      (SKIPPED_HEALTHY still flows here) and a persistently-pending instance
      (DRS not initialized in TargetRegion, control-plane connectivity blocked).
    onFailure: Continue
    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        InstanceId: '{{ InstanceId }}'
        Status: '{{ assessRegistration.Status }}'
        Threshold: '{{ PendingEscalationThreshold }}'
      Script: |
        import boto3
        def handler(e, c):
            ssm = boto3.client('ssm')
            iid = e['InstanceId']; status = e.get('Status', '')
            try:
                thr = int(e.get('Threshold', '3'))
            except Exception:
                thr = 3
            name = '/drs/pending/%s' % iid
            # Any registered state clears the counter.
            if status in ('HEALTHY', 'IN_PROGRESS', 'UNHEALTHY', 'REVERSE_REPLICATION'):
                try:
                    ssm.delete_parameter(Name=name)
                except Exception:
                    pass
                return {'PendingCount': 0, 'Escalate': 'false'}
            # PENDING_REGISTRATION (or anything not registered) -> increment.
            cur = 0
            try:
                cur = int(ssm.get_parameter(Name=name)['Parameter']['Value'])
            except Exception:
                cur = 0
            cur += 1
            try:
                ssm.put_parameter(Name=name, Value=str(cur), Type='String', Overwrite=True)
            except Exception:
                pass
            return {'PendingCount': cur, 'Escalate': ('true' if cur >= thr else 'false')}
    outputs:
      - Name: PendingCount
        Selector: '$.Payload.PendingCount'
        Type: Integer
      - Name: Escalate
        Selector: '$.Payload.Escalate'
        Type: String
    nextStep: reportOnboard

  - name: reportOnboard
    action: aws:executeScript
    description: Write S3 audit report + emit CloudWatch metric for the onboarding outcome (no SNS on success — failure/issue steps handle alerts).
    onFailure: Continue
    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        Account: '{{ global:ACCOUNT_ID }}'
        InstanceId: '{{ InstanceId }}'
        Event: 'ONBOARD'
        Status: '{{ assessRegistration.Status }}'
        SourceServerID: '{{ assessRegistration.SourceServerID }}'
        Detail: '{{ assessRegistration.ReplicationState }}'
        SnsTopicArn: ''
        Subject: '[DRS Onboarding] {{ InstanceId }}'
        Message: ''
        Bucket: '{{ AuditBucket }}'
        Namespace: '{{ CloudWatchNamespace }}'
      Script: |
        import boto3, json
        from datetime import datetime
        def handler(e, c):
            status=e.get('Status',''); event=e.get('Event',''); iid=e.get('InstanceId','')
            ts=datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
            rec={'instanceId':iid,'event':event,'overallStatus':status,'sourceServerID':e.get('SourceServerID',''),'detail':e.get('Detail',''),'timestamp':ts}
            out={}
            topic=e.get('SnsTopicArn') or ''
            if topic:
                try:
                    boto3.client('sns').publish(TopicArn=topic, Subject=(e.get('Subject') or 'DRS')[:100], Message=(e.get('Message') or json.dumps(rec)))
                    out['sns']='sent'
                except Exception as ex: out['snsError']=str(ex)
            good={'SUCCESS','HEALED','HEALED_RESTART','HEALED_REINSTALL','SKIPPED_HEALTHY','HEALTHY','IN_PROGRESS','AUDIT_NOACTION','PENDING_REGISTRATION','COMPLETED','SKIPPED_STOPPED'}
            try:
                boto3.client('cloudwatch').put_metric_data(Namespace=e.get('Namespace','DRSAutomation'),
                  MetricData=[{'MetricName':'Outcome','Value':1 if status in good else 0,'Unit':'Count','Dimensions':[{'Name':'Event','Value':event}]}])
                out['metric']='ok'
            except Exception as ex: out['metricError']=str(ex)
            bucket=e.get('Bucket') or ''
            if bucket:
                try:
                    key='drs/%s/%s/%s-%s.json'%(e.get('Account','acct'), iid or 'unknown', event or 'event', ts.replace(':','-'))
                    boto3.client('s3').put_object(Bucket=bucket, Key=key, Body=json.dumps(rec).encode(), ContentType='application/json')
                    out['s3']='s3://%s/%s'%(bucket,key)
                except Exception as ex: out['s3Error']=str(ex)
            return out
    nextStep: branchOutcome

  - name: branchOutcome
    action: aws:branch
    description: Alert on unhealthy replication, reverse/failback registration, or persistent PENDING; otherwise end.
    inputs:
      Choices:
        - NextStep: notifyRegistrationIssue
          Variable: '{{ assessRegistration.Status }}'
          StringEquals: UNHEALTHY
        - NextStep: notifyReverseDirection
          Variable: '{{ assessRegistration.Status }}'
          StringEquals: REVERSE_REPLICATION
        - NextStep: notifyPendingEscalation
          Variable: '{{ trackPending.Escalate }}'
          StringEquals: 'true'
    isEnd: true

  - name: notifyRegistrationIssue
    action: aws:executeScript
    description: Notify (SNS) + S3 audit + metric — registered but replication unhealthy.
